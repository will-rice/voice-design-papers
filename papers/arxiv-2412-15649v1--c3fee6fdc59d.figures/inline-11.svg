<span id="A3.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A3.p7.pic1.2.1" class="ltx_p"><span id="A3.p7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">I need your help to evaluate the performance of several models in the speech interaction scenario. The models will receive a speech input from the user, which they need to understand and respond to with a speech output. 
<br class="ltx_break">Your task is to rate the model’s responses based on the provided user input transcription [Question], the model’s output transcription [Response] and the correct answer [Reference]. 
<br class="ltx_break"></span></span>
<span id="A3.p7.pic1.2.2" class="ltx_p"><span id="A3.p7.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are the transcription of user’s instruction, models’ response and the reference answer: 
<br class="ltx_break">### [Question] 
<br class="ltx_break">{question} 
<br class="ltx_break"></span></span>
<span id="A3.p7.pic1.2.3" class="ltx_p"><span id="A3.p7.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">### [Response] 
<br class="ltx_break">{answer} 
<br class="ltx_break"></span></span>
<span id="A3.p7.pic1.2.4" class="ltx_p"><span id="A3.p7.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">### [Reference] 
<br class="ltx_break">{reference} 
<br class="ltx_break"></span></span>
<span id="A3.p7.pic1.2.5" class="ltx_p"><span id="A3.p7.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Is the model’s response correct based on the question and reference answer? 
<br class="ltx_break">Please only output a single &quot;Yes&quot; or &quot;No&quot;. Do not output anything else.</span></span>
</span></span></span></foreignobject></g></g></svg>